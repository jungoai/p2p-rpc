server {
    listen 5001;

    location = / {
        add_header 'Access-Control-Allow-Origin' '*';
        proxy_pass http://127.0.0.1:4001/; # p2prpc address
        include proxy_params;
    }

    location / {
        add_header 'Access-Control-Allow-Origin' '*';
        proxy_pass http://70.34.217.65:4010/main/evm/; # rpc address
        include proxy_params;
    }
}
